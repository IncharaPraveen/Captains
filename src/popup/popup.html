<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captains</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Captains</h1>

      <section aria-labelledby="page-tools-heading">
        <h2 id="page-tools-heading">Page tools</h2>
        <button id="open-reader" class="primary-button" type="button">
          Open reading view
        </button>
        <div class="button-row">
          <button id="start-reading" type="button">Read page aloud</button>
          <button id="stop-reading" type="button">Stop</button>
        </div>
      </section>

      <section aria-labelledby="display-heading">
        <h2 id="display-heading">Display</h2>
        <label class="setting">
          <span>
            OpenDyslexic
            <small>Apply on every website</small>
          </span>
          <input
            id="open-dyslexic"
            class="feature-toggle"
            type="checkbox"
            role="switch"
          />
        </label>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
